services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_URL: ${APP_URL}
      SETUP_TOKEN: ${SETUP_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TIBB_DATABASE_PATH: /app/data/tibb.sqlite
    volumes:
      - tibb-data:/app/data
volumes:
  tibb-data:
